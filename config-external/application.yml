# ========================================
# 外部配置文件示例（部署时使用）
# ========================================
# 此文件挂载到 Docker 容器的 /app/config/application.yml
# 用于覆盖内置配置，实现部署时配置管理
#
# 使用方法：
# 1. 复制此目录到生产服务器
# 2. 修改配置值（敏感配置使用环境变量）
# 3. Docker Compose 挂载: ./config-external:/app/config:ro

# 服务器配置覆盖
server:
  port: ${SERVER_PORT:8080}

# 日志配置覆盖
logging:
  level:
    root: WARN
    org.unreal.modelrouter: INFO
  file:
    name: /app/logs/trunkline.log

# 数据库配置覆盖
# 保留环境变量占位符，避免挂载本文件后压过 DATABASE_URL / DATABASE_USERNAME / DATABASE_PASSWORD
# （初始化向导选择远程 PG 时依赖这些变量生效）
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:/app/data/trunkline;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_UPPER=FALSE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}

# 存储配置
store:
  type: jpa
  path: /app/config-store

# 监控端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized