# Trunkline prod Redis baseline (tracked file; do NOT put passwords here).
# docker-compose.prod.yml mounts this file and injects the password via
# --requirepass $$REDIS_PASSWORD from the environment.

# Listen on all container interfaces; only the compose network and the
# loopback host binding publish the port (see docker-compose.prod.yml).
bind 0.0.0.0
protected-mode yes
port 6379

# Durability: JWT blacklist / quota ledger / revocation broadcast must survive
# a Redis restart.
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Resource guardrails (compose also enforces a container memory limit).
maxmemory 256mb
maxmemory-policy allkeys-lru

# Slow command visibility without logging credentials.
slowlog-log-slower-than 10000
slowlog-max-len 128
