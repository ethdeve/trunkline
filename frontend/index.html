<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JAiRouter 控制台</title>
    <style>
      /* 基础重置：常驻 */
      body { margin: 0; padding: 0; min-height: 100vh;
             background: #f5f7fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
      /* 启动屏居中：仅在 .boot 存在时生效（:has 挂载后自动失效），
         避免 body 长期 display:flex 使 #app 收缩包裹内容并被居中，
         导致宽页面（如实例表 1420px）把整个壳层撑出视口、左栏被推出屏幕 */
      body:has(> #app > .boot) { display: flex; align-items: center; justify-content: center; }
      .boot { text-align: center; color: #606266; }
      .boot .spinner { width: 36px; height: 36px; margin: 0 auto 16px; border-radius: 50%;
             border: 3px solid #dcdfe6; border-top-color: #409eff; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot">
        <div class="spinner"></div>
        <p>正在加载 JAiRouter 控制台...</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
