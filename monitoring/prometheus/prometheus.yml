# Prometheus配置文件
# Trunkline监控栈的核心配置

global:
  # 全局抓取间隔
  scrape_interval: 15s
  # 全局评估间隔
  evaluation_interval: 15s
  # 外部标签（用于联邦和远程存储）
  external_labels:
    cluster: 'trunkline-cluster'
    environment: 'production'

# 告警规则文件配置
rule_files:
  - "rules/*.yml"

# 告警管理器配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
      timeout: 10s
      api_version: v2

# 抓取配置
scrape_configs:
  # Prometheus自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 15s
    metrics_path: /metrics
    honor_labels: true

  # Trunkline应用监控
  - job_name: 'trunkline'
    static_configs:
      - targets: ['trunkline:8080']
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: '/actuator/prometheus'
    honor_labels: true
    params:
      format: ['prometheus']
    relabel_configs:
      # 添加实例标签
      - source_labels: [__address__]
        target_label: instance
        replacement: 'trunkline-main'
      # 添加服务标签
      - target_label: service
        replacement: 'trunkline'
    metric_relabel_configs:
      # 过滤掉不需要的JVM指标
      - source_labels: [__name__]
        regex: 'jvm_classes_.*'
        action: drop
      # 重命名指标标签
      - source_labels: [__name__]
        regex: 'http_server_requests_seconds_(.*)'
        target_label: __name__
        replacement: 'trunkline_http_requests_${1}'

  # AlertManager监控
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
    scrape_interval: 15s
    metrics_path: /metrics

  # Node Exporter系统监控
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'trunkline-host'

  # cAdvisor容器监控
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 15s
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'trunkline-containers'

  # Trunkline健康检查端点
  - job_name: 'trunkline-health'
    static_configs:
      - targets: ['trunkline:8080']
    scrape_interval: 30s
    metrics_path: '/actuator/health'
    params:
      format: ['prometheus']
    relabel_configs:
      - target_label: service
        replacement: 'trunkline-health'

  # Redis监控（用于JWT持久化）
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 15s
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'trunkline-redis'
      - target_label: service
        replacement: 'redis'

  # JWT持久化专用监控端点
  - job_name: 'trunkline-jwt-persistence'
    static_configs:
      - targets: ['trunkline:8080']
    scrape_interval: 10s
    metrics_path: '/actuator/prometheus'
    params:
      format: ['prometheus']
    relabel_configs:
      - target_label: service
        replacement: 'trunkline-jwt-persistence'
    metric_relabel_configs:
      # 只保留JWT相关的指标
      - source_labels: [__name__]
        regex: 'trunkline_security_jwt_.*|trunkline_security_api_key_.*|trunkline_security_storage_.*|trunkline_security_audit_.*'
        action: keep
      # 重命名JWT指标
      - source_labels: [__name__]
        regex: 'trunkline_security_jwt_(.*)'
        target_label: __name__
        replacement: 'jwt_${1}'

