# ========================================
# 开发环境配置（v2.8.x 精简版）
# ========================================
# 此文件仅包含开发环境特定的差异化配置
# 基础配置通过模块化导入，详见 application.yml

# 服务器配置（开发环境）
server:
  port: 8080

# Swagger API 文档配置（仅开发环境）
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
  packages-to-scan: org.unreal.modelrouter.controller
  show-actuator: true
  cache:
    disabled: true

# H2 控制台（仅开发环境）
spring:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  # ===== 本地切换 PostgreSQL（默认关闭，仍走 H2 ./data/trunkline）=====
  # 方式一（推荐，不改文件）：启动前设置环境变量即可一键切库。
  #   config/config-service/core.yml 的 ${DATABASE_URL:...} 会被环境变量覆盖，
  #   FlywayDialectEnvironmentPostProcessor 自动切到 db/migration/postgres，
  #   并把 ddl-auto 覆盖为 validate（建表交给 Flyway）。
  #   需先建库：CREATE DATABASE trunkline;
  #     DATABASE_URL=jdbc:postgresql://localhost:5432/trunkline
  #     DATABASE_USERNAME=trunkline
  #     DATABASE_PASSWORD=<password>
  # 方式二（改文件）：取消下面 datasource 注释。注意 profile 配置优先级高于
  #   classpath import，取消后 core.yml 的 ${DATABASE_URL:...}（含环境变量）不再生效。
  # datasource:
  #   url: jdbc:postgresql://localhost:5432/trunkline
  #   username: trunkline
  #   password: trunkline
  #   driver-class-name: org.postgresql.Driver

# 日志配置（开发环境详细日志）
logging:
  level:
    org.unreal.modelrouter: DEBUG
    org.springframework: INFO

# 管理端点（开发环境全部开放）
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      show-components: always
    jwt-tokens:
      enabled: true
    jwt-blacklist:
      enabled: true
    jwt-persistence-health:
      enabled: true

# 安全配置（开发环境启用测试功能）
trunkline:
  call-history:
    record-level: SUMMARY   # 脱敏摘要（默认截断200字）；要完整诗文用 FULL（AES-256-GCM 加密存储）
  security:
    enabled: true
    
    jwt:
      enabled: true
      secret: "${JWT_SECRET:${DEV_JWT_SECRET:dev-secret-key-for-testing-only-32-characters-minimum}}"

      accounts:
        - username: "admin"
          password: "{noop}${INITIAL_ADMIN_PASSWORD:ChangeMeOnFirstStartup123456}"
          roles: ["ADMIN", "USER"]
          enabled: true
        # 不在此硬编码 user 账户：本地账号请通过「账号管理」API/控制台创建，
        # 否则同名 YAML 静态账户会遮蔽库内账号，导致「已创建却无法登录」（见生产 jwt.yml 同样处理）。

    api-key:
      enabled: true
      
    audit:
      log-level: "DEBUG"
      include-request-body: true
      include-response-body: true
    
    sanitization:
      response:
        enabled: false

# WebClient 配置（开发环境宽松超时）
webclient:
  connection-timeout: 5s
  read-timeout: 15s
  write-timeout: 15s

# 调试模式
debug: false