# ========================================
# Trunkline 向后兼容性配置文件（legacy profile）
# ========================================
# 用途：给「从未开启认证」的老 JAiRouter 部署升级 Trunkline 时做过渡——
#       该 profile 把全部安全功能（API Key / JWT / 脱敏 / 审计）整体关闭，
#       保证升级后网关行为与老版本一致，不会因为新增认证导致调用方全部 401。
# 使用方式: --spring.profiles.active=legacy 或 SPRING_PROFILES_ACTIVE=legacy
#
# ⚠️ 谁还需要它：仅「升级过渡期」的用户。新部署一律不要用这个 profile
#    （等于裸奔上公网）。S1 已提供配置前缀 / Redis key / configKey 三层兼容
#    （见 README「从旧版升级」），配置层面的兼容不再依赖本文件。
#
# 🗓️ 弃用计划：计划在 S3 阶段评估移除。届时会先在 CHANGELOG 与 README
#    发出弃用公告，保留至少一个大版本周期。如你在使用本 profile，
#    请到仓库提 issue 告知，以便评估移除时机。

spring:
  profiles:
    active: legacy

# ========================================
# 向后兼容模式安全配置覆盖
# ========================================
# 在向后兼容模式下，所有安全功能默认关闭
# 这确保现有的部署在升级后能够正常工作，无需修改配置
trunkline:
  security:
    # 安全功能总开关 - 向后兼容模式下默认关闭
    enabled: false
    
    # API Key 认证配置 - 向后兼容模式
    api-key:
      # 即使安全功能关闭，也保持API Key配置结构以便后续启用
      enabled: false
      cache-enabled: false
      keys: []  # 空的API Key列表
    
    # JWT 认证配置 - 向后兼容模式
    jwt:
      enabled: false
      secret: ""
      blacklist-enabled: false
    
    # 数据脱敏配置 - 向后兼容模式
    sanitization:
      request:
        enabled: false
        sensitive-words: []
        pii-patterns: []
        log-sanitization: false
        whitelist-users: []
        whitelist-ips: []
      
      response:
        enabled: false
        sensitive-words: []
        pii-patterns: []
        log-sanitization: false
        service-specific-rules:
          chat:
            additional-patterns: []
          embedding:
            enabled: false
    
    # 安全审计配置 - 向后兼容模式
    audit:
      enabled: false
      include-request-body: false
      include-response-body: false
      alert-enabled: false
      event-types:
        authentication-success: false
        authentication-failure: false
        authorization-failure: false
        sanitization-applied: false
        configuration-changed: false
        security-alert: false
        suspicious-activity: false
    
    # 安全监控配置 - 向后兼容模式
    monitoring:
      enabled: false
      metrics:
        authentication:
          enabled: false
        sanitization:
          enabled: false
        security-events:
          enabled: false
          by-event-type: false
          by-user: false
          by-ip: false
      alerts:
        enabled: false
        notifications:
          log:
            enabled: false
    
    # 性能优化配置 - 向后兼容模式
    performance:
      authentication:
        async-enabled: false
        thread-pool-size: 10
        timeout-ms: 5000
      sanitization:
        parallel-enabled: false
        thread-pool-size: 5
        streaming-threshold: 1048576
        regex-cache-size: 100
      cache:
        redis:
          enabled: false
          host: "localhost"
          port: 6379
          password: ""
          database: 0
          timeout: 2000
          pool:
            max-active: 8
            max-idle: 8
            min-idle: 0
        local:
          enabled: true

  # 错误追踪配置 - 向后兼容模式
  monitoring:
    error-tracking:
      enabled: false  # 向后兼容模式下关闭错误追踪

# ========================================
# 向后兼容性说明
# ========================================
# 此配置文件的目的是确保现有的老 JAiRouter 部署在升级到 Trunkline 时
# 能够无缝工作，不会因为新增的安全功能而导致服务中断或配置错误。
#
# 使用场景：
# 1. 现有生产环境升级时的过渡期配置
# 2. 需要逐步启用安全功能的渐进式部署
# 3. 测试环境中需要关闭安全功能的场景
# 4. 开发环境中暂时不需要安全功能的情况
#
# 启用方式：
# 1. 命令行参数: java -jar app.jar --spring.profiles.active=legacy
# 2. 环境变量: SPRING_PROFILES_ACTIVE=legacy
# 3. 配置文件: spring.profiles.active=legacy
#
# 注意事项：
# 1. 此配置仅用于向后兼容，不建议在新部署中长期使用
# 2. 建议在确认系统稳定后，逐步启用安全功能
# 3. 可以通过配置管理工具动态切换到安全模式