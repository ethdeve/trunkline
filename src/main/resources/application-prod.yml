# ========================================
# 生产环境配置
# ========================================
# 此文件仅包含生产环境特定的差异化配置；基础配置通过模块化导入，详见 application.yml。
# 敏感配置必须使用环境变量！多副本部署基线详见 deploy/README.md。

# 日志配置（生产环境最小化）
logging:
  level:
    root: WARN
    org.unreal.modelrouter: WARN
    org.springframework: ERROR
  file:
    name: logs/trunkline-prod.log

# 存储配置（生产环境关闭自动迁移）
store:
  migration:
    enabled: false
  security-migration:
    enabled: false

# H2 控制台（生产环境关闭）
spring:
  h2:
    console:
      enabled: false

# 管理端点（生产环境最小开放）
management:
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

# 安全配置（生产环境）
trunkline:
  # 【A3-pre · 多副本部署基线】5 个共享态开关默认全关、自检只在确认多副本时触发。
  # 多副本必须：① 显式 replicas（见下）；② 部署清单开启 5 开关（jwt blacklist/persistence redis、
  # cache redis、quota distributed、persistence redis，Redis 须可达），否则 mode=FAIL 启动失败。
  # 后果对照表与清单模板见 deploy/README.md。
  cluster:
    # 副本数显式声明，默认单副本（=1）。刻意不设 0：0 会回退 K8s 环境探测
    # （KUBERNETES_SERVICE_HOST / POD_NAME），把单副本 K8s Pod 误判为多副本、在 FAIL 下误伤启动。
    # 多副本部署必须由运维显式设置 TRUNKLINE_REPLICAS=N（N>1）才能触发共享态自检。
    replicas: ${TRUNKLINE_REPLICAS:1}
    shared-state-check:
      # 生产默认 FAIL：多副本 + 共享态开关未开 → 启动失败（fail-fast，禁止带病上线）；单副本静默。
      mode: FAIL

  # 调用记录加密密钥（O4 · fail-closed）：生产禁止 auto 模式明文密钥落盘，密钥必须经
  # TRUNKLINE_CALL_HISTORY_KEY 注入（Base64 编码的 32 字节 AES-256）；缺失启动失败，多副本各副本同值。
  call-history:
    encryption-key-required: true

  security:
    # 生产环境安全功能
    enabled: true

    # 【O3 · 安全开关化】统一口径：基础默认关（matchIfMissing=false）+ prod 显式开。
    archive:
      enabled: true

    jwt:
      enabled: true
      # 生产必须显式注入强密钥；别名顺序 JWT_SECRET > PROD_JWT_SECRET > DEV_JWT_SECRET，
      # 与 StartupSecretKeyChecker 的「显式注入」判定同口径（issue #674）；三者皆无时 fail-fast。
      secret: "${JWT_SECRET:${PROD_JWT_SECRET:${DEV_JWT_SECRET:}}}"
      issuer: "trunkline-prod"

      # 【生产 fail-closed】黑名单存储不可用/降级期间，已撤销/登出令牌一律按“在黑名单”拒绝（401）。
      # 基础模块与 dev 刻意 false（可用性优先，issue #76/#118）；可被 TRUNKLINE_SECURITY_JWT_BLACKLIST_FAIL_CLOSED_WHEN_UNAVAILABLE 覆盖。
      blacklist-fail-closed-when-unavailable: true

      # 【issue #676】profile 级显式收紧，覆盖唯一真源 persistence-base.yml；取值与真源默认一致，
      # 保留是为让「生产不开令牌台账」的安全意图可读。黑名单持久化不由这里控制。
      persistence:
        enabled: false
        redis:
          enabled: false

    api-key:
      enabled: true
      default-expiration-days: 365
      # 【O3】过期清理（幂等）与轮换（带 ScheduledTaskLock）production 默认开，基础默认关。
      expiration-cleanup:
        enabled: true
      rotation:
        enabled: true

    audit:
      # 【O3 · 安全开关化】增强审计 production 默认开：真实落库 + 死信兜底链路，不静默丢事件。
      enhanced: true
      log-level: "WARN"
      include-request-body: false
      include-response-body: false
      retention-days: 90
      alert-enabled: true
      alert-thresholds:
        auth-failures-per-minute: 5
        suspicious-requests-per-minute: 10

    sanitization:
      response:
        enabled: true
        log-sanitization: false

    monitoring:
      enabled: true
      # 安全告警阈值语义 = 「窗口内计数」；原比率键与 email/webhook 通知从未实现，已按出口契约移除。
      alerts:
        enabled: true
        window-check-interval-ms: 300000
        thresholds:
          authentication-failure-count: 5
          authentication-failure-window-minutes: 5
          suspicious-ip-count: 10
          suspicious-ip-window-minutes: 10
          sanitization-count: 100
          sanitization-window-minutes: 60
          jwt-failure-count: 20
          jwt-failure-window-minutes: 10
          cooldown-minutes: 15
        notifications:
          log:
            enabled: true

    # 性能配置（生产环境优化）
    performance:
      authentication:
        thread-pool-size: 20
        timeout-ms: 3000
      sanitization:
        thread-pool-size: 10
        streaming-threshold: 2097152
      cache:
        local:
          api-key:
            max-size: 10000
          jwt-blacklist:
            max-size: 100000
