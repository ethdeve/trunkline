# ========================================
# Trunkline 主配置文件（v2.8.x 模块化重构版）
# ========================================
# 此文件为模块化重构后的主配置文件
# 通过导入各服务模块配置实现配置分离
# 支持外部配置文件（/app/config/）

# 企业扩展点预埋（S2 任务 32-36）
# 租户行级过滤总开关：默认 false（社区版零行为变化）；
# 仅商业版多租户解锁后由 enterprise 部署配置置 true（TenantJpaFilter 随之装配）
trunkline:
  tenant:
    filter-enabled: false

spring:
  config:
    import:
      # ====== common 模块配置 ======
      - classpath:config/common/server.yml
      - classpath:config/common/webclient.yml
      - classpath:config/common/logging.yml
      - classpath:config/common/scheduling.yml
      - classpath:config/common/cluster.yml

      # ====== config-service 模块配置 ======
      - classpath:config/config-service/core.yml

      # ====== router 模块配置 ======
      # 注：adapter/loadbalancer/circuitbreaker/pools/rules.yml 已于 2026-11-09 删除——
      # 五者的全部键与 Java 代码默认值完全一致（ModelRouterProperties /
      # CircuitBreakerManager / RoutingMonitorConfig / PoolDefinitionProperties /
      # RuleDefinitionProperties），无独占生效值；对应键仍可通过
      # application-{profile}.yml、环境变量或外部挂载覆盖。
      - classpath:config/router/ratelimit.yml
      - classpath:config/router/fallback.yml
      - classpath:config/router/services.yml

      # ====== auth 模块配置 ======
      - classpath:config/auth/jwt.yml
      - classpath:config/auth/api-key.yml
      - classpath:config/auth/audit.yml
      - classpath:config/auth/sanitization.yml

      # ====== monitor 模块配置 ======
      - classpath:config/base/monitoring-base.yml
      - classpath:config/monitor/slow-query-alerts.yml
      - classpath:config/monitor/error-tracking.yml
      - classpath:config/monitor/persistence-monitoring-base.yml

      # ====== tracing 模块配置 ======
      - classpath:config/tracing/tracing-base.yml

      # ====== persistence 模块配置 ======
      - classpath:config/persistence/state-persistence-base.yml

      # ====== security 基础配置（原「向后兼容」组） ======
      # 注：base/server-base.yml 与 base/model-services-base.yml 已于 2026-11-09 删除——
      # 二者的全部键与 common/*、router/*、config-service/core.yml 同值重复，无独占内容。
      - classpath:config/security/security-base.yml
      - classpath:config/security/persistence-base.yml
      - classpath:config/security/audit-base.yml

      # ====== 配额账本配置 ======
      - classpath:config/quota/quota-base.yml

      # ====== 外部配置文件（#634：必须放在 import 列表末尾） ======
      # spring.config.import 中后导入的条目优先级更高——此前外部挂载列在最前，
      # 同名键被 classpath 默认值静默覆盖，挂载配置从未真正生效。
      # Docker 部署时挂载到 /app/config/
      - optional:file:/app/config/application.yml
      - optional:file:/app/config/auth/jwt.yml
      - optional:file:/app/config/auth/api-key.yml
      - optional:file:/app/config/router/services.yml

# ========================================
# 配置模块说明（v2.8.x）
# ========================================
# 新模块化配置结构：
#
# common 模块（公共基础设施）:
# - config/common/server.yml       # 服务器配置
# - config/common/webclient.yml    # WebClient 配置
# - config/common/logging.yml      # 日志配置
#
# config-service 模块（配置服务）:
# - config/config-service/core.yml # ConfigurationService 配置
#
# router 模块（路由服务）:
# - config/router/ratelimit.yml    # 限流配置（含分布式限流开关）
# - config/router/fallback.yml     # 降级配置
# - config/router/services.yml     # 服务实例配置
# 注：adapter/loadbalancer/circuitbreaker/pools/rules 配置的默认值
#     内置于 Java 代码（ModelRouterProperties、CircuitBreakerManager、
#     RoutingMonitorConfig 等），如需覆盖通过环境配置或外部挂载即可。
#
# auth 模块（认证服务）:
# - config/auth/jwt.yml            # JWT 认证配置
# - config/auth/api-key.yml        # API Key 配置
# - config/auth/audit.yml          # 安全审计配置
# - config/auth/sanitization.yml   # 数据脱敏配置
#
# monitor 模块（监控服务）:
# - config/base/monitoring-base.yml
# - config/monitoring/*.yml
#
# tracing 模块（链路追踪）:
# - config/tracing/tracing-base.yml
#
# persistence 模块（持久化服务）:
# - config/persistence/state-persistence-base.yml
#
# security 基础配置（原「向后兼容」组，保留——各有独占键）:
# - config/security/security-base.yml    # 安全默认值（api-key 开关、脱敏兜底、审计、监控告警、缓存开关）
# - config/security/persistence-base.yml # JWT 持久化 + spring.data.redis 连接
# - config/security/audit-base.yml       # JWT/API Key 审计明细
#
# 已删除（2026-11-09 配置梳理：全部键与新模块文件同值重复，无独占内容）：
# - config/base/server-base.yml          # → common/server.yml、common/webclient.yml、common/logging.yml、config-service/core.yml
# - config/base/model-services-base.yml  # → router/*.yml
#
# 已删除（2026-11-09 二次梳理：全部键与 Java 代码默认值同值重复，无独占生效内容）：
# - config/router/adapter.yml            # → ModelRouterProperties（adapter 默认 normal）
# - config/router/loadbalancer.yml       # → ModelRouterProperties（random/md5）+ RoutingMonitorConfig
# - config/router/circuitbreaker.yml     # → CircuitBreakerManager（5 次/60s/2 次）
# - config/router/pools.yml              # → PoolDefinitionProperties（默认空列表）
# - config/router/rules.yml              # → RuleDefinitionProperties（默认空列表）

# ========================================
# 配置加载优先级说明
# ========================================
# 配置加载优先级（高优先级覆盖低优先级）：
# 1. 模块配置文件（最低优先级）
# 2. 主配置文件 application.yml
# 3. 环境配置文件 application-{profile}.yml
# 4. 环境变量（最高优先级）
#
# 敏感配置项必须使用环境变量：
# - JWT_SECRET: JWT 密钥（长度 >= 32 字符）
# - GPUSTACK_API_TOKEN: GPUStack API Token
# - REDIS_PASSWORD: Redis 密码（如启用 Redis）
# 管理员密码不再作为启动期环境变量：首次部署访问 /init 向导创建（其余账号在「账户管理」中配置）。

# ========================================
# 使用说明
# ========================================
# 1. 基础配置修改：编辑对应模块配置文件
# 2. 环境差异配置：编辑对应的环境配置文件
# 3. 敏感配置：使用环境变量注入
#
# 启动示例：
# 开发环境：java -jar app.jar --spring.profiles.active=dev
# 生产环境：java -jar app.jar --spring.profiles.active=prod -DJWT_SECRET=your-secret
# 数据库迁移：java -jar app.jar --spring.profiles.active=migrate
# 注：staging profile 已于 2026-11-09 移除（无部署入口使用）；如需预发布差异配置，
#     请用外部挂载配置文件或环境变量覆盖，勿再新增 application-staging.yml