# ========================================
# JWT 认证配置 (auth 模块)
# ========================================
# 此文件包含 JWT 认证相关配置
# 位置：org.unreal.modelrouter.auth.security

trunkline:
  security:
    # 安全功能开关
    enabled: true

    jwt:
      # JWT 功能开关
      enabled: true
      
      # JWT 令牌头名称
      jwt-header: "Trunkline_Token"
      
      # JWT 密钥（长度 >= 32 字符；禁止使用出厂默认值）
      # 安全说明：不在此处提供任何可用的默认密钥。JWT_SECRET / PROD_JWT_SECRET /
      # DEV_JWT_SECRET 三者皆未设置时，StartupSecurityEnvironmentPostProcessor 会在启动期
      # 生成随机密钥并持久化到 data/jwt-secret（重启复用、源码中无法预测）。
      # 三个别名与 StartupSecretKeyChecker 的「显式注入」判定必须保持同一口径（issue #674）。
      secret: "${JWT_SECRET:${PROD_JWT_SECRET:${DEV_JWT_SECRET:}}}"
      
      # JWT 算法
      algorithm: "HS256"
      
      # 令牌过期时间（分钟）
      expiration-minutes: 60
      
      # 刷新令牌过期时间（天）
      refresh-expiration-days: 7
      
      # JWT 发行者
      issuer: "trunkline"
      
      # 黑名单功能
      blacklist-enabled: true
      blacklist-cache:
        expiration-seconds: 86400
        max-size: 10000
      
      # 用户账户配置
      # 【2026-11-10】不再提供默认管理员账号密码。首次部署后由 /init 初始化向导
      # 采集并创建首个管理员（只写库，不落 YAML）；高级部署仍可显式配置静态账户，
      # 但那属于自担风险的自定义配置，不再是开箱默认行为。
      accounts: []

      # ── JWT 持久化 / 黑名单持久化：唯一真源不在这里 ──────────────────────────
      # 【issue #676】application.yml 的 spring.config.import 中，
      #   classpath:config/auth/jwt.yml            (:39，先导入)
      #   classpath:config/security/persistence-base.yml (:60，后导入，优先级更高)
      # 此前本文件也定义了整套 persistence / blacklist 子树且取值相反
      # （true/h2/false vs false/file/true），结果本文件的键 100% 被静默覆盖，
      # 形成「改了不生效」的假配置。现已整块移除，唯一真源为 persistence-base.yml。
      #
      # 需要开关时请用环境变量（真源里已留占位符）：
      #   JWT_PERSISTENCE_ENABLED           → trunkline.security.jwt.persistence.enabled
      #   JWT_BLACKLIST_PERSISTENCE_ENABLED → trunkline.security.jwt.blacklist.persistence.enabled
      # 注意：这两个开关控制的是组件扫描实现与定时任务，会改变 JwtServiceConfiguration
      # 的装配结果；默认值刻意与历史实际生效值一致，改动前请跑完整上下文启动验证。
      # 黑名单条目本身由 JwtServiceConfiguration#storeManagerJwtBlacklistService
      # （无条件 @Bean，写入 StoreManager/H2）落盘，不依赖上述开关。
