# ========================================
# JWT 认证配置 (auth 模块)
# ========================================
# 此文件包含 JWT 认证相关配置
# 位置：org.unreal.modelrouter.auth.security

trunkline:
  security:
    # 安全功能开关
    enabled: true

    jwt:
      # JWT 功能开关
      enabled: true
      
      # JWT 令牌头名称
      jwt-header: "Trunkline_Token"
      
      # JWT 密钥（长度 >= 32 字符；禁止使用出厂默认值）
      # 安全说明：不在此处提供任何可用的默认密钥。未显式设置 JWT_SECRET / DEV_JWT_SECRET 时，
      # JwtSecretEnvironmentPostProcessor 会在启动期生成随机密钥并持久化到 data/jwt-secret
      # （重启复用、源码中无法预测），离线伪造令牌的前提因此不成立。
      secret: "${JWT_SECRET:${DEV_JWT_SECRET:}}"
      
      # JWT 算法
      algorithm: "HS256"
      
      # 令牌过期时间（分钟）
      expiration-minutes: 60
      
      # 刷新令牌过期时间（天）
      refresh-expiration-days: 7
      
      # JWT 发行者
      issuer: "trunkline"
      
      # 黑名单功能
      blacklist-enabled: true
      blacklist-cache:
        expiration-seconds: 86400
        max-size: 10000
      
      # 用户账户配置
      # 【2026-11-10】不再提供默认管理员账号密码。首次部署后由 /init 初始化向导
      # 采集并创建首个管理员（只写库，不落 YAML）；高级部署仍可显式配置静态账户，
      # 但那属于自担风险的自定义配置，不再是开箱默认行为。
      accounts: []

      # JWT 持久化配置
      persistence:
        enabled: true
        primary-storage: h2
        fallback-storage: memory
        composite:
          enabled: false
        sync:
          enabled: false
        startup-recovery:
          enabled: true
        cleanup:
          schedule: "0 */5 * * * ?"
          retention-days: 7
        redis:
          # 只保留开关：连接信息统一由 REDIS_HOST/REDIS_PORT/REDIS_PASSWORD 或 spring.data.redis.* 提供。
          # 原先这里的 host/port/password/database 自 issue #196（取消 JWT 独立 Redis）起已无消费者，
          # 留着会让人以为改它有效（见 #202）。
          enabled: false

      # JWT 黑名单持久化配置
      blacklist:
        persistence:
          enabled: true
          primary-storage: h2
          max-memory-size: 10000
        composite:
          enabled: false
        redis:
          # 同上：只保留开关
          enabled: false