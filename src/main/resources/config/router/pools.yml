# ========================================
# 资源池配置 (router 模块)
# ========================================
# 此文件包含资源池的默认定义
# 位置：org.unreal.modelrouter.router.pool
# 绑定：PoolDefinitionProperties (@ConfigurationProperties("model.pools"))
#
# 资源池说明:
#   - 一组同服务类型实例的命名集合
#   - 请求 model 使用 poolName(如 company-chat)时,自动从池内健康实例中选择执行
#   - 必须显式创建:没有对应的池时请求直接 404,不存在任何隐式的默认池/系统分组
#   - 默认为空列表:不配置时所有模型名都不可调用
#
# 策略 (strategy):
#   weighted-random（权重随机,默认）/ round-robin / least-connections / ip-hash
# 成员 (members):
#   - instance-id: 实例 ID(对应实例管理中的 instanceId)
#   - weight: 池级权重(默认 1)
#   - model-name: 可选,响应回显的模型名(缺省用实例名)
#
# 示例:
# model:
#   pools:
#     - pool-name: company-chat
#       name: 公司通用对话
#       service-type: chat
#       enabled: true
#       strategy: weighted-random
#       members:
#         - instance-id: inst-gpt
#           weight: 9
#         - instance-id: inst-claude
#           weight: 1

model:
  pools: []
